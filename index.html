<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SunnyStore – Rank SunnySMP</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #fff8e6;
      --bg2: #e9f4ff;
      --ink: #5a3410;
      --mut: #8a6a45;
      --card: #fffdf6;
      --acc: #f5a623;
      --acc2: #e07b00;
      --line: #f3d98b;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #1d1a14;
        --bg2: #17202b;
        --ink: #fbeccb;
        --mut: #cdb68b;
        --card: #2a251b;
        --line: #4a3f27
      }
    }

    :root[data-theme="dark"] {
      --bg: #1d1a14;
      --bg2: #17202b;
      --ink: #fbeccb;
      --mut: #cdb68b;
      --card: #2a251b;
      --line: #4a3f27
    }

    html {
      scroll-padding-top: 90px;
      scroll-behavior: smooth
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: Nunito, system-ui, sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, var(--bg2), var(--bg) 380px);
      background-color: var(--bg);
      line-height: 1.5
    }

    h1,
    h2,
    .brand {
      font-family: 'Baloo 2', Nunito, sans-serif
    }

    nav {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: color-mix(in srgb, var(--bg) 85%, transparent);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid var(--line)
    }

    .brand {
      font-weight: 800;
      font-size: 1.45rem;
      color: var(--acc2);
      text-decoration: none;
      margin-right: auto
    }

    .nl {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 99px;
      font-weight: 700;
      font-size: .9rem;
      text-decoration: none;
      color: #fff;
      transition: transform .15s
    }

    .nl:hover {
      transform: translateY(-2px)
    }

    .wa {
      background: #22b455
    }

    .dc {
      background: #5865f2
    }

    .logo {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      border: 2px solid var(--line);
      object-fit: cover
    }

    @media(max-width:520px) {
      .nl span {
        display: none
      }

      .nl {
        padding: 9px 11px
      }

      .nl svg {
        margin: 0
      }
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 18px 16px 60px
    }

    .hero {
      width: 100%;
      border-radius: 22px;
      display: block;
      box-shadow: 0 10px 30px rgba(224, 123, 0, .2)
    }

    .intro {
      text-align: center;
      margin: 26px auto 8px;
      max-width: 560px
    }

    .intro h1 {
      margin: 0;
      font-size: clamp(1.7rem, 5vw, 2.4rem);
      color: var(--acc2)
    }

    .intro p {
      margin: 6px 0 0;
      color: var(--mut)
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 22px;
      margin-top: 26px
    }

    .card {
      background: var(--card);
      border-radius: 26px;
      padding: 12px 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px
    }

    .card img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 18px
    }

    .buy {
      position: relative;
      overflow: hidden;
      border: 0;
      cursor: pointer;
      font: 800 1.1rem 'Baloo 2', sans-serif;
      color: #fff;
      padding: 12px;
      border-radius: 99px;
      background: linear-gradient(135deg, #ffc247, var(--acc2));
      box-shadow: 0 5px 0 #b45f00;
      animation: pulse 2.4s infinite;
      transition: transform .12s, box-shadow .12s
    }

    .buy::after {
      content: "";
      position: absolute;
      top: 0;
      left: -60%;
      width: 40%;
      height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .6), transparent);
      transform: skewX(-20deg);
      animation: shine 2.6s infinite
    }

    .buy:hover {
      transform: translateY(-2px)
    }

    .buy:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #b45f00
    }

    .buy:focus-visible,
    .nl:focus-visible {
      outline: 3px solid #2a7de1;
      outline-offset: 3px
    }

    @keyframes shine {
      0% {
        left: -60%
      }

      60%,
      100% {
        left: 130%
      }
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1)
      }

      50% {
        transform: scale(1.03)
      }
    }

    @media(prefers-reduced-motion:reduce) {

      .buy,
      .buy::after {
        animation: none
      }

      html {
        scroll-behavior: auto
      }
    }

    .srv {
      margin-top: 26px;
      background: var(--card);
      border: 2px solid var(--line);
      border-radius: 26px;
      padding: 18px
    }

    .srv h2 {
      margin: 0 0 12px;
      font-size: 1.4rem;
      color: var(--acc2);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap
    }

    .st {
      font: 700 .8rem Nunito, sans-serif;
      padding: 3px 12px;
      border-radius: 99px;
      color: #fff;
      background: #999
    }

    .st.on {
      background: #22b455
    }

    .st.off {
      background: #e5484d
    }

    .info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      margin-bottom: 14px
    }

    .box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      border: 2px solid var(--line);
      border-radius: 16px;
      padding: 8px 10px 8px 14px
    }

    .box small {
      display: block;
      color: var(--mut);
      font-size: .75rem
    }

    .box b {
      font-size: 1.05rem;
      word-break: break-all
    }

    .cp {
      border: 0;
      cursor: pointer;
      border-radius: 10px;
      padding: 7px 12px;
      font: 700 .85rem Nunito, sans-serif;
      color: #fff;
      background: var(--acc2)
    }

    .cp:focus-visible,
    .rf:focus-visible {
      outline: 3px solid #2a7de1;
      outline-offset: 3px
    }

    .cnt {
      margin: 0 0 8px;
      font-weight: 700
    }

    .pl {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none
    }

    .pl li {
      background: var(--bg);
      border: 2px solid var(--line);
      border-radius: 99px;
      padding: 4px 14px;
      font-weight: 700
    }

    .note {
      margin: 0;
      color: var(--mut);
      font-size: .9rem
    }

    .rf {
      margin-left: auto;
      border: 2px solid var(--line);
      background: transparent;
      color: var(--ink);
      border-radius: 99px;
      padding: 3px 12px;
      cursor: pointer;
      font: 700 .8rem Nunito, sans-serif
    }

    footer {
      text-align: center;
      color: var(--mut);
      padding: 20px 16px 30px;
      font-size: .9rem
    }
  </style>
</head>

<body>
  <nav>
    <a class="brand" href="#">SunnyStore</a>
    <a class="nl wa" href="https://chat.whatsapp.com/H1YoR3EuXhs1Q8IpHIieJ4klo" target="_blank" rel="noopener"><svg
        width="18" height="18" viewBox="0 0 24 24" fill="#fff">
        <path
          d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm5.2 14.1c-.2.6-1.300 1.200-1.800 1.200-.5.1-1 .2-3.300-.7-2.800-1.200-4.600-4-4.700-4.200-.1-.2-1.100-1.500-1.100-2.800s.7-2 1-2.300c.2-.3.500-.3.700-.3h.5c.2 0 .4 0 .6.500l.8 2c.1.200.1.300 0 .5l-.3.400-.4.400c-.1.200-.3.300-.1.600.2.300.8 1.300 1.700 2.100 1.200 1 2.100 1.300 2.400 1.500.3.100.4.100.6-.1l.8-1c.2-.3.400-.2.600-.1l1.900.9c.3.1.5.2.5.3.1.100.1.600-.1 1.200z" />
      </svg><span>Komunitas WA</span></a>
    <a class="nl dc" href="https://discord.gg/mzEc3P9CX" target="_blank" rel="noopener"><svg width="18" height="18"
        viewBox="0 0 24 24" fill="#fff">
        <path
          d="M20 4.500A17 17 0 0 0 15.800 3l-.5 1a15 15 0 0 0-4.600 0l-.5-1A17 17 0 0 0 4 4.500C1.300 8.500.6 12.400.9 16.200a17 17 0 0 0 5.200 2.600l1.100-1.800-1.700-.8.400-.3a12 12 0 0 0 10.200 0l.4.300-1.700.8 1.100 1.800a17 17 0 0 0 5.200-2.600c.4-4.400-.7-8.300-3.100-11.700zM8.700 14c-1 0-1.800-.9-1.800-2s.8-2 1.800-2 1.800.9 1.800 2-.8 2-1.800 2zm6.600 0c-1 0-1.800-.9-1.800-2s.8-2 1.800-2 1.800.9 1.800 2-.8 2-1.800 2z" />
      </svg><span>Discord</span></a>
    <img class="logo" src="logo.jpg" alt="Logo SunnySMP">
  </nav>
  <main>
    <img class="hero" src="banner.jpg" alt="Rank SunnySMP – Raih rank, nikmati lebih banyak fitur!">
    <section class="srv" aria-live="polite">
      <h2>Server Online <span class="st" id="st">Memuat…</span><button class="rf" id="rf" type="button">Refresh</button>
      </h2>
      <div class="info">
        <div class="box">
          <div><small>IP</small><b>play.sunnysmp.xyz</b></div><button class="cp" data-v="play.sunnysmp.xyz"
            type="button">Salin</button>
        </div>
        <div class="box">
          <div><small>Port</small><b>11004</b></div><button class="cp" data-v="11004" type="button">Salin</button>
        </div>
      </div>
      <p class="cnt" id="cnt"></p>
      <ul class="pl" id="pl"></ul>
      <p class="note" id="nt"></p>
    </section>
    <div class="intro">
      <h1>Daftar Rank</h1>
      <p>Pilih rank yang kamu mau, lalu klik Beli. Kamu akan diarahkan ke WhatsApp admin.</p>
    </div>
    <section class="grid" id="ranks"></section>
  </main>
  <footer>© SunnyStore · SunnySMP</footer>
  <script>
    const IMG = { sunshine: "sunshine.png", sunbeam: "sunbeam.png", sunset: "sunset.png", summer: "summer.png", solstice: "solstice.png", solaris: "solaris.png" };
    const R = [["Sunshine", "Rp15.000"], ["Sunbeam", "Rp35.000"], ["Sunset", "Rp65.000"], ["Summer", "Rp120.000"], ["Solstice", "Rp150.000"], ["Solaris", "Rp300.000"]];
    const g = document.getElementById("ranks");
    R.forEach(([n, p]) => {
      const d = document.createElement("article"); d.className = "card";
      d.innerHTML = `<img loading="lazy" src="${IMG[n.toLowerCase()]}" alt="Rank ${n} ${p}"><button class="buy" type="button">Beli ${n}</button>`;
      d.querySelector("button").onclick = () => {
        const t = `Hallo admin sunnysmp, saya ingin membeli rank ${n} dengan harga ${p}, nama minecraft saya : `;
        window.open("https://wa.me/6283854510244?text=" + encodeURIComponent(t), "_blank", "noopener");
      };
      g.appendChild(d);
    });

    const H = "play.sunnysmp.xyz", P = 11004, $ = id => document.getElementById(id);
    async function load() {
      const st = $("st"), pl = $("pl"); st.className = "st"; st.textContent = "Memuat…";
      try {
        const r = await fetch(`https://api.mcsrvstat.us/3/${H}:${P}`); const d = await r.json();
        if (!d.online) { st.className = "st off"; st.textContent = "Offline"; $("cnt").textContent = ""; pl.innerHTML = ""; $("nt").textContent = "Server sedang offline."; return }
        st.className = "st on"; st.textContent = "Online";
        const n = d.players?.online ?? 0, m = d.players?.max ?? "?";
        $("cnt").textContent = `${n} / ${m} pemain online`;
        const list = d.players?.list || []; pl.innerHTML = "";
        list.forEach(p => { const li = document.createElement("li"); li.textContent = p.name; pl.appendChild(li) });
        $("nt").textContent = n === 0 ? "Belum ada pemain online." : list.length ? "" : "Daftar nama pemain disembunyikan oleh server.";
      } catch (e) { st.className = "st off"; st.textContent = "Gagal memuat"; $("nt").textContent = "Status tidak bisa diambil. Coba refresh." }
    }
    $("rf").onclick = load; load(); setInterval(load, 60000);
    document.querySelectorAll(".cp").forEach(b => b.onclick = async () => {
      try { await navigator.clipboard.writeText(b.dataset.v); b.textContent = "Tersalin!" } catch (e) { b.textContent = "Gagal" }
      setTimeout(() => b.textContent = "Salin", 1500)
    });
  </script>
</body>

</html>
